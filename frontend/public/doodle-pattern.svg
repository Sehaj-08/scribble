<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <!-- Skribbl-inspired Doodle Pattern -->
  <g stroke="rgba(255, 255, 255, 0.14)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. Pencil (top-left) -->
    <g transform="translate(30, 25) rotate(-35)">
      <rect x="0" y="0" width="10" height="34" rx="2" />
      <polygon points="0,34 10,34 5,44" />
      <line x1="0" y1="8" x2="10" y2="8" />
      <line x1="5" y1="44" x2="5" y2="40" />
    </g>

    <!-- 2. Smiling Star (top-center) -->
    <g transform="translate(155, 30)">
      <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" />
      <circle cx="-3" cy="0" r="0.75" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="3" cy="0" r="0.75" fill="rgba(255, 255, 255, 0.14)" />
      <path d="M -2.5,3 Q 0,5.5 2.5,3" />
    </g>

    <!-- 3. Paint Palette & Brush (top-right) -->
    <g transform="translate(250, 25)">
      <path d="M 0,15 C -5,0 20,-10 32,5 C 40,15 35,32 20,32 C 12,32 10,24 5,24 C 2,24 0,20 0,15 Z" />
      <circle cx="8" cy="8" r="2.5" />
      <circle cx="18" cy="4" r="2.5" />
      <circle cx="26" cy="12" r="2.5" />
      <circle cx="16" cy="24" r="2" />
    </g>

    <!-- 4. Spiral Squiggle (upper-left-mid) -->
    <g transform="translate(95, 80)">
      <path d="M 0,0 C 8,-8 16,0 16,8 C 16,16 6,18 2,12 C -2,6 4,-2 10,-2" />
    </g>

    <!-- 5. Idea Lightbulb (upper-right-mid) -->
    <g transform="translate(210, 85)">
      <path d="M 6,0 C -3,0 -6,8 -2,14 C 0,17 2,19 2,22 L 10,22 C 10,19 12,17 14,14 C 18,8 15,0 6,0 Z" />
      <line x1="3" y1="25" x2="9" y2="25" />
      <line x1="4" y1="28" x2="8" y2="28" />
      <line x1="6" y1="-4" x2="6" y2="-7" />
      <line x1="14" y1="-2" x2="17" y2="-4" />
      <line x1="-2" y1="-2" x2="-5" y2="-4" />
    </g>

    <!-- 6. Cute Cloud (mid-left) -->
    <g transform="translate(20, 125)">
      <path d="M 8,20 L 30,20 C 35,20 38,16 36,12 C 37,7 32,3 28,5 C 26,1 20,0 16,3 C 12,0 6,2 5,7 C 0,8 0,16 5,19 Z" />
      <line x1="10" y1="24" x2="8" y2="28" />
      <line x1="18" y1="24" x2="16" y2="28" />
      <line x1="26" y1="24" x2="24" y2="28" />
    </g>

    <!-- 7. Paint Brush (center) -->
    <g transform="translate(145, 140) rotate(45)">
      <rect x="0" y="0" width="6" height="26" rx="2" />
      <path d="M 0,26 L 6,26 L 5,34 C 4,37 2,37 1,34 Z" fill="rgba(255, 255, 255, 0.08)" />
      <line x1="0" y1="6" x2="6" y2="6" />
    </g>

    <!-- 8. Sparkles / Stars (mid-right) -->
    <g transform="translate(275, 145)">
      <path d="M 0,-10 L 2,-3 L 9,0 L 2,3 L 0,10 L -2,3 L -9,0 L -2,-3 Z" />
    </g>

    <!-- 9. Chat / Question Bubble (lower-left-mid) -->
    <g transform="translate(80, 195)">
      <rect x="0" y="0" width="28" height="20" rx="5" />
      <path d="M 6,20 L 3,26 L 12,20 Z" />
      <circle cx="8" cy="10" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="14" cy="10" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="20" cy="10" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
    </g>

    <!-- 10. Ruler / Measuring tool (center-lower) -->
    <g transform="translate(180, 215) rotate(-15)">
      <rect x="0" y="0" width="36" height="12" rx="2" />
      <line x1="6" y1="0" x2="6" y2="5" />
      <line x1="12" y1="0" x2="12" y2="7" />
      <line x1="18" y1="0" x2="18" y2="5" />
      <line x1="24" y1="0" x2="24" y2="7" />
      <line x1="30" y1="0" x2="30" y2="5" />
    </g>

    <!-- 11. Dice / Cube (lower-right) -->
    <g transform="translate(265, 220)">
      <rect x="0" y="0" width="22" height="22" rx="4" />
      <circle cx="6" cy="6" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="16" cy="6" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="11" cy="11" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="6" cy="16" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
      <circle cx="16" cy="16" r="1.5" fill="rgba(255, 255, 255, 0.14)" />
    </g>

    <!-- 12. Crayon / Marker (bottom-left) -->
    <g transform="translate(35, 260) rotate(25)">
      <rect x="0" y="8" width="11" height="24" rx="1" />
      <polygon points="0,8 11,8 5.5,0" />
      <line x1="0" y1="14" x2="11" y2="14" />
      <line x1="0" y1="26" x2="11" y2="26" />
    </g>

    <!-- 13. Drawing Easel / Canvas (bottom-center) -->
    <g transform="translate(130, 265)">
      <rect x="4" y="0" width="26" height="18" rx="2" fill="rgba(255, 255, 255, 0.04)" />
      <line x1="17" y1="0" x2="17" y2="-5" />
      <line x1="8" y1="18" x2="4" y2="34" />
      <line x1="26" y1="18" x2="30" y2="34" />
      <line x1="17" y1="18" x2="17" y2="34" />
      <!-- Tiny mountain sketch on canvas -->
      <polyline points="9,14 14,8 18,12 22,6 26,14" />
    </g>

    <!-- 14. Wink Face (bottom-right-corner) -->
    <g transform="translate(230, 275)">
      <circle cx="12" cy="12" r="12" />
      <path d="M 6,9 Q 8,7 10,9" />
      <circle cx="16" cy="9" r="1.2" fill="rgba(255, 255, 255, 0.14)" />
      <path d="M 7,15 Q 12,19 17,15" />
    </g>

    <!-- 15. Corner connecting doodles to ensure seamless tile edges -->
    <!-- Corner Top-Left & Bottom-Right link -->
    <g transform="translate(0, 0)">
      <path d="M 0,10 Q 10,0 20,5" />
    </g>
    <g transform="translate(305, 305)">
      <path d="M 0,10 Q 10,0 15,5" />
    </g>
    <g transform="translate(300, 10)">
      <circle cx="8" cy="8" r="4" />
    </g>
  </g>
</svg>
